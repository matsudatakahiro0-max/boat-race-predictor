<div class="card"><b>水面・場特性</b><div id="venueTraits" class="small">場を選択すると表示します</div></div>
<div class="card"><b>① 6艇比較</b><div class="small">平均ST・全国/当地・モーター・展示・進入を横比較</div><div id="racers" class="small">未取得</div></div>
<div class="card"><b>② 当該コース実績（利用可能な全履歴）</b>

<div id="courseHistory" class="small"></div></div>

<div id="recentST" class="small">全履歴集計後に判定します</div></div>

<script>
const $=x=>document.getElementById(x),dt=$("date"),st=$("stadium"),rc=$("race");
let now=new Date();dt.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
function n(v,d=0){v=Number(v);return Number.isFinite(v)?v:d}
function score(r,l){let s=n(r.national_win_rate)*10+n(r.local_win_rate)*4+n(r.motor_top_2_percent)*.3+(.22-n(r.average_start_timing,.20))*90;if(l===1)s+=22;if(l===2)s+=8;if(l===3)s+=7;if(l===4)s+=4;return s}

function ymd2(x){return `${x.getFullYear()}${String(x.getMonth()+1).padStart(2,"0")}${String(x.getDate()).padStart(2,"0")}`}
async function loadMaxHistory(A){
 const hs=document.getElementById("historyStatus"), hv=document.getElementById("courseHistory");
 hs.textContent="2026/1/1〜前日までの利用可能な全結果を集計中…"; hv.innerHTML="";
 const target={};
 A.forEach(x=>target[String(x.r.number)]={lane:x.i,name:x.r.name||"",n:0,p1:0,p2:0,p3:0,stSum:0,stN:0,rankSum:0,rankN:0,sashi:0,makuri:0,makurizashi:0,recent:[],sameMeet:[],flying:0,
motorNo:null,motorRuns:0,motorTop3:0,winLinks:{},secondLinks:{}});
 A.forEach(x=>{let t=target[String(x.r.number)];t.flying=Number(x.r.flying_count||0);t.motorNo=Number(x.r.motor_number||0);});
 let end=new Date(dt.value+"T12:00:00"), cur=new Date(2026,0,1), days=[];
 while(cur<end){days.push(new Date(cur));cur.setDate(cur.getDate()+1)}
 let pos=0, done=0;
 async function worker(){
   while(pos<days.length){
     const day=days[pos++], ds=ymd2(day);
     try{
       let r=await fetch(`https://boatraceopenapi.github.io/api/v1/${ds.slice(0,4)}/${ds}.json`,{cache:"force-cache"});
       if(!r.ok){done++;continue}
       let j=await r.json(), ss=j?.programs?.stadiums||{};
       for(const sk in ss) for(const rk in (ss[sk]?.races||{})){
         let rr=ss[sk].races[rk], rs=rr?.result?.racers;if(!rs)continue;
         let starts=[];
         for(let e=1;e<=6;e++){let z=rs[String(e)]||rs[e], q=Number(z?.start_timing);if(z&&Number.isFinite(q))starts.push({num:String(z.number),st:q})}
         starts.sort((a,b)=>a.st-b.st);
         for(let e=1;e<=6;e++){
           let z=rs[String(e)]||rs[e];if(!z)continue;
           let t=target[String(z.number)]; if(!t || Number(z.course_number)!==t.lane)continue;
           t.n++; let pl=Number(z.place_number); if(pl===1){t.p1++;let tech=Number(rr?.result?.technique_number);if(tech===2)t.sashi++;if(tech===3)t.makuri++;if(tech===4)t.makurizashi++;}if(pl===2)t.p2++;if(pl===3)t.p3++;
           let q=Number(z.start_timing);if(Number.isFinite(q)){t.stSum+=q;t.stN++;let ix=starts.findIndex(v=>v.num===String(z.number)&&v.st===q);if(ix>=0){t.rankSum+=ix+1;t.rankN++}}
           if(Number.isFinite(q)){
             t.recent.push({date:rr.date||"",st:q,course:Number(z.course_number),place:pl,stadium:Number(rr.stadium_number)});
             if(Number(rr.stadium_number)===Number(A[0]?.race?.stadium_number)) t.sameMeet.push({date:rr.date||"",st:q,course:Number(z.course_number),place:pl});
           }
           if(pl===1){
             let second=null,third=null;
             for(let ee=1;ee<=6;ee++){let zz=rs[String(ee)]||rs[ee];if(!zz)continue;if(Number(zz.place_number)===2)second=Number(zz.course_number);if(Number(zz.place_number)===3)third=Number(zz.course_number);}
             if(second)t.winLinks[second]=(t.winLinks[second]||0)+1;
             if(second&&third){let k=second+"-"+third;t.secondLinks[k]=(t.secondLinks[k]||0)+1;}
           }
         }
       }
     }catch(e){}
     done++; if(done%20===0)hs.textContent=`全履歴集計中… ${done}/${days.length}日`;
   }
 }
 await Promise.all(Array.from({length:10},worker));
 let T=Object.values(target).sort((a,b)=>a.lane-b.lane);
 let stadiumNo=Number(A[0]?.race?.stadium_number||0);
 let pv=A[0]?.race?.preview||{};
 let vt=document.getElementById("venueTraits");
 let venueText=venueConditionText(stadiumNo,pv);
 // Empirical current-data-range venue 1-course rate is not inferred here unless enough race records were explicitly accumulated.
 vt.innerHTML=venueText+`<br>当日条件：風速 ${pv?.wind_speed??"—"}m/s / 波高 ${pv?.wave_height??"—"}cm`;

 hv.innerHTML=T.map(t=>{
   let pc=x=>t.n?(100*x/t.n).toFixed(1)+"%":"—", ast=t.stN?(t.stSum/t.stN).toFixed(3):"—", sr=t.rankN?(t.rankSum/t.rankN).toFixed(2):"—";
   return `<div class="row"><b>${t.lane}号艇 ${t.name}</b><br>${t.lane}コース　母数 <b>${t.n}走</b> / 1着 ${pc(t.p1)} / 2着 ${pc(t.p2)} / 3着 ${pc(t.p3)}<br>平均ST ${ast} / 平均ST順位 ${sr}<br>勝ち筋：差し ${pc(t.sashi)} / まくり ${pc(t.makuri)} / まくり差し ${pc(t.makurizashi)}</div>`;
 }).join("");
 hs.className="ok";hs.textContent=`全履歴集計完了：2026/01/01〜${dt.value}の前日（取得可能データ最大範囲）`;
 const alerts=[]; T.filter(t=>t.lane>=2).forEach(t=>[["差し",t.sashi],["まくり",t.makuri],["まくり差し",t.makurizashi]].forEach(([method,wins])=>{const rate=t.n?100*wins/t.n:0;if(t.n>=10&&rate>=30)alerts.push({lv:"⚠️ 強特化",t,method,wins,rate});else if(t.n>=15&&rate>=25)alerts.push({lv:"🔎 特化警戒",t,method,wins,rate});}));alerts.sort((a,b)=>b.rate-a.rate||b.t.n-a.t.n);const sa=document.getElementById("specialAlert");sa.innerHTML=alerts.length?alerts.map(a=>`<div class="row"><b>${a.lv}：${a.t.lane}号艇 ${a.t.name}</b><br>${a.t.lane}コース ${a.method}　${a.wins}/${a.t.n}勝 = <b>${a.rate.toFixed(1)}%</b><br>→ 攻め艇・逃げ崩し候補として重点警戒</div>`).join(""):"今回、母数を満たした25%以上の決まり手特化異常値はありません。";
 
 // Recent / meet ST and F warning
 const rst=document.getElementById("recentST");
 rst.innerHTML=T.map(t=>{
   let rec=[...t.recent].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,10);
   let meet=[...t.sameMeet].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8);
   let av=a=>a.length?(a.reduce((s,x)=>s+x.st,0)/a.length).toFixed(3):"—";
   let warn=t.flying>0?" ⚠️F"+t.flying:"";
   return `<div class="row"><b>${t.lane}号艇 ${t.name}${warn}</b><br>直近${rec.length}走ST平均 ${av(rec)} / 今開催取得${meet.length}走 ${av(meet)}<br>直近ST：${rec.map(x=>x.st.toFixed(2)).join(" / ")||"—"}</div>`;
 }).join("");

 // Motor history: scan already loaded historical races for same motor at same stadium when program data exists
 const motorStats={}; T.forEach(t=>motorStats[t.lane]={n:0,top3:0,top2:0});
 // Current API exposes motor aggregate percentages reliably; show them with current racer data.
 A.forEach(x=>{let m=motorStats[x.i];m.rate2=Number(x.r.motor_top_2_percent);m.rate3=Number(x.r.motor_top_3_percent);m.no=x.r.motor_number;});
 document.getElementById("motorHistory").innerHTML=A.map(x=>{
   let m=motorStats[x.i];
   return `<div class="row"><b>${x.i}号艇 ${x.r.name} / ${m.no||"—"}号機</b><br>モーター2連率 ${Number.isFinite(m.rate2)?m.rate2.toFixed(1)+"%":"—"} / 3連率 ${Number.isFinite(m.rate3)?m.rate3.toFixed(1)+"%":"—"}</div>`;
 }).join("");

 // Link data when each racer wins from today's course
 document.getElementById("linkData").innerHTML=T.map(t=>{
   let total=Object.values(t.winLinks).reduce((a,b)=>a+b,0);
   let arr=Object.entries(t.winLinks).sort((a,b)=>b[1]-a[1]).slice(0,4);
   return `<div class="row"><b>${t.lane}号艇が${t.lane}コース1着時</b>（${total}勝）<br>2着コース：${arr.length?arr.map(([c,n])=>`${c}コース ${n}/${total}=${(100*n/total).toFixed(1)}%`).join(" / "):"データなし"}</div>`;
 }).join("");

 // Attack/wall score: historical course win rate + ST + technique specialization
 let aw=T.map(t=>{
   let win=t.n?t.p1/t.n:0, st=t.stN?t.stSum/t.stN:.30;
   let attack=(win*100)+Math.max(0,(.22-st)*120)+(t.n?100*Math.max(t.makuri,t.makurizashi)/t.n:0)*.45;
   return {...t,attack};
 }).sort((a,b)=>b.attack-a.attack);
 let attacker=aw.find(x=>x.lane>=2);
 let wall2=T.find(x=>x.lane===2),wall3=T.find(x=>x.lane===3);
 let walltxt=[wall2,wall3].filter(Boolean).map(t=>`${t.lane}号艇：1着${t.n?(100*t.p1/t.n).toFixed(1):"—"}% / ST${t.stN?(t.stSum/t.stN).toFixed(3):"—"}`).join("　");
 document.getElementById("attackWall").innerHTML=`<b>攻め艇候補：${attacker?attacker.lane+"号艇 "+attacker.name:"—"}</b><br>②③壁比較：${walltxt}<br>※当該コース母数・平均ST・まくり/まくり差し実績から算出`;

 // Weather / preview details
 try{
   let pv=A[0]?.race?.preview||null;
   if(pv){
     document.getElementById("exview").innerHTML += `<br>風速 ${pv.wind_speed??"—"}m/s / 波高 ${pv.wave_height??"—"}cm / 気温 ${pv.air_temperature??"—"}℃ / 水温 ${pv.water_temperature??"—"}℃`;
   }
 }catch(e){}

 // Re-rank using course data with sample weighting and update picks
 const enriched=A.map(x=>{let t=target[String(x.r.number)],w=t?Math.min(1,t.n/30):0;
   let course=t&&t.n?((t.p1*3+t.p2*2+t.p3)/t.n)*20:0;
   return {...x,cs:x.sc*(1-.55*w)+course*.55*w,h:t};
 });
 let outer=enriched.slice(1).sort((a,b)=>b.cs-a.cs), aa=outer[0],bb=outer[1],cc=outer[2];
 let m=[`1-${aa.i}-${bb.i}`,`1-${bb.i}-${aa.i}`,`1-${aa.i}-${cc.i}`,`1-${bb.i}-${cc.i}`];
 let f=[`${aa.i}-1-${bb.i}`,`${aa.i}-${bb.i}-1`];
 document.getElementById("main").textContent="カテゴリーA（全履歴反映）　"+m.join(" / ");
 document.getElementById("fail").textContent="イン逃げ失敗時（全履歴反映）　"+f.join(" / ");
 document.getElementById("second").innerHTML=`2着候補順位（全履歴反映）：${outer.map(x=>x.i+"号艇").join(" ＞ ")}`;
}


const VENUE_TRAITS={
1:["桐生","淡水のプール水面。冬季は赤城おろしの強風に注意。"],
2:["戸田","全国有数のインが弱い水面。コース幅が狭く、センター・ダッシュのまくりに注意。"],
3:["江戸川","河川水面。潮流と風の組み合わせで荒れやすく、水面対応力を重視。"],
4:["平和島","海水。イン絶対ではなくセンター勢の攻めも警戒。"],
5:["多摩川","淡水で比較的静水面。スピード戦になりやすい。"],
6:["浜名湖","広い汽水水面。風の影響を受けやすく、季節風に注意。"],
7:["蒲郡","ナイター中心のプール型水面。比較的走りやすいが風向変化を確認。"],
8:["常滑","海水。伊勢湾からの風の影響を受けやすい。"],
9:["津","海水。季節風が強い日は波・安定板を要確認。"],
10:["三国","淡水。冬季の強風・波立ちに注意。"],
11:["びわこ","淡水。標高が高く、風・うねりの影響でセンター攻めが効く場面に注意。"],
12:["住之江","淡水プール。イン優勢傾向が強い代表的水面。"],
13:["尼崎","淡水プール。比較的静水面でイン中心になりやすい。"],
14:["鳴門","海水。潮位・潮流と風の影響を確認。"],
15:["丸亀","海水ナイター。潮位差と風の影響を受ける。"],
16:["児島","海水。潮位差が大きく、満干潮による水面変化に注意。"],
17:["宮島","海水。潮位差が大きく、満潮前後は水面変化に注意。"],
18:["徳山","海水。イン優勢傾向が強い場。潮位と風も確認。"],
19:["下関","海水ナイター。イン優勢傾向。潮・風による変化を確認。"],
20:["若松","海水ナイター。潮位差と風の影響を受ける。"],
21:["芦屋","淡水。比較的イン優勢。風が強い日はセンター攻めも再評価。"],
22:["福岡","汽水。1Mが那珂川河口にあり満潮時は難水面。北寄りの風でうねり注意、センターまくりも効きやすい。"],
23:["唐津","淡水。比較的広い水面でイン優勢傾向。風向・風速を確認。"],
24:["大村","海水。全国でもイン優勢傾向が強い代表的水面。"]
};
function venueConditionText(stadiumNo,pv){
 const v=VENUE_TRAITS[stadiumNo]||["不明","場特性データなし"];
 let w=Number(pv?.wind_speed), wave=Number(pv?.wave_height), dir=String(pv?.wind_direction||pv?.wind_direction_number||"");
 let notes=[];
 if(Number.isFinite(w)&&w>=5)notes.push(`⚠️ 風速${w}m/s：強風補正が必要`);
 if(Number.isFinite(wave)&&wave>=5)notes.push(`⚠️ 波高${wave}cm：水面悪化を警戒`);
 if(stadiumNo===22){notes.push("⚠️ 福岡：満潮・北寄りの風では1Mのうねりを重点警戒");}
 if(stadiumNo===3){notes.push("⚠️ 江戸川：潮流×風向で水面が大きく変化");}
 if(stadiumNo===2){notes.push("⚠️ 戸田：イン過信禁止。3・4コースの攻撃力を重点確認");}
 return `<b>${v[0]}</b><br>${v[1]}<br>${notes.join("<br>")}`;
}

async function run(){
 let status=$("status");status.className="small";status.textContent="取得中…";$("racers").innerHTML="";$("main").textContent="";$("fail").textContent="";
 try{
  let ds=dt.value.replaceAll("-",""), url=`https://boatraceopenapi.github.io/api/v1/${ds.slice(0,4)}/${ds}.json`;
  let res=await fetch(url,{cache:"no-store"});if(!res.ok)throw Error("API "+res.status);
  let data=await res.json(), rr=data?.programs?.stadiums?.[String(st.value)]?.races?.[String(rc.value)];
  if(!rr)throw Error("このレースのデータがありません");
  let A=[];
  for(let i=1;i<=6;i++){let r=rr.racers?.[String(i)]||{},p=rr.preview?.racers?.[String(i)]||{},sc=score(r,i);A.push({i,sc,r,p});
   $("racers").innerHTML+=`<div class="row"><b>${i}号艇 ${r.name||"—"}</b><br>平均ST ${r.average_start_timing??"—"} / 全国勝率 ${r.national_win_rate??"—"} / 当地 ${r.local_win_rate??"—"} / モーター2連 ${r.motor_top_2_percent??"—"}%<br>展示ST ${p.start_timing??"—"} / 展示 ${p.exhibition_time??"—"} / 進入 ${p.course_number??"—"}</div>`;
  }
  let o=A.slice(1).sort((a,b)=>b.sc-a.sc),a=o[0],b=o[1],c=o[2],avg=o.reduce((q,x)=>q+x.sc,0)/5,esc=Math.max(35,Math.min(82,Math.round(55+(A[0].sc-avg)*.45)));
  let mains=[`1-${a.i}-${b.i}`,`1-${b.i}-${a.i}`,`1-${a.i}-${c.i}`,`1-${b.i}-${c.i}`],fails=[`${a.i}-1-${b.i}`,`${a.i}-${b.i}-1`];
  let stOrder=[...A].sort((x,y)=>n(x.r.average_start_timing,.30)-n(y.r.average_start_timing,.30));
  let exA=A.map(x=>({i:x.i,st:n(x.p.start_timing,9),et:n(x.p.exhibition_time,99),course:n(x.p.course_number,x.i)}));
  let exValid=exA.filter(x=>x.st<1), etValid=exA.filter(x=>x.et<90);
