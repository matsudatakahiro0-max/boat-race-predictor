<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>競艇予想アプリ WATER 最新版</title><style>
body{margin:0;background:#f0f5fb;color:#172c47;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:18px}
main{max-width:560px;margin:8vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px #122f5112}h1{font-size:22px}p{line-height:1.65}a{display:block;background:#1768b5;color:#fff;text-decoration:none;padding:14px;text-align:center;border-radius:10px;font-weight:700;margin-top:14px}small{color:#617187}
</style></head><body><main><h1>競艇予想アプリ WATER</h1><p id="status">公開中の最新版を検索しています…</p><a id="launch" href="#">最新版を開く</a><p><small>自動で開かない場合は上のボタンを押してください。新しいHTMLはGitHubの同じリポジトリの最上位にアップロードしてください。</small></p></main><script>
(async()=>{
const status=document.getElementById('status'), launch=document.getElementById('launch');
const fallback='競艇予想アプリ_統合改善版12.19.html.html';
function v(name){const normalized=name.normalize('NFC');const m=normalized.match(/(?:WATER[^0-9]*|改善版|統合版)?(\d{1,2})[._-](\d{1,2})(?!\d)/i);return m?Number(m[1])*1000+Number(m[2]):-1;}
function set(name){const url=encodeURIComponent(name);launch.href=url;launch.textContent=name.normalize('NFC')+' を開く';return url;}
set(fallback);
try{
  const r=await fetch('https://api.github.com/repos/matsudatakahiro0-max/boat-race-predictor/contents/?ref=main',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
  if(!r.ok)throw new Error('GitHub一覧の取得失敗');
  const items=await r.json();if(!Array.isArray(items))throw new Error('一覧データが不正');
  const list=items.filter(f=>f.type==='file' && /\.html(?:\.html)?$/i.test(f.name) && f.name!=='index.html' && (/WATER/i.test(f.name)||/競艇予想ア/.test(f.name)) && v(f.name)>=0);
  list.sort((a,b)=>v(b.name)-v(a.name) || a.name.localeCompare(b.name,'ja'));
  const chosen=list[0]?.name || fallback;
  status.textContent='最新版を開いています：'+chosen.normalize('NFC');
  location.replace(set(chosen));
}catch(e){status.textContent='自動検索ができませんでした。下のリンクから現在の12.19を開けます。';}
})();
</script></body></html>
