<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>競艇予想</title>
<style>body{font-family:-apple-system,sans-serif;background:#f3f5f7;margin:0;color:#17212b}header{background:white;padding:14px;font-weight:800}main{padding:10px;max-width:800px;margin:auto}.card{background:white;border-radius:12px;padding:12px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}select,input,button{width:100%;padding:11px;font-size:16px;border:1px solid #ccd3dc;border-radius:8px}button{background:#1677ff;color:#fff;border:0;font-weight:800}.row{padding:8px 0;border-bottom:1px solid #eee}.pick{font-size:19px;font-weight:800;line-height:1.7}.small{font-size:12px;color:#65717c}.ok{padding:9px;background:#e8f7ed;border-radius:8px}.err{padding:9px;background:#ffe8e8;border-radius:8px;color:#9d1b1b}
.card b{font-size:15px}.card{border:1px solid #dfe4ea;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.row{line-height:1.6}.pick{background:#f7f9fc;padding:9px;border-radius:9px;margin-top:8px}
#main{border-left:4px solid #1677ff}#fail{border-left:4px solid #777}
#decision{font-size:16px}.small{line-height:1.6}
</style></head><body><header>競艇予想システム MAXDATA 1.0</header><main>
<div class="card"><div class="grid"><input id="date" type="date"><select id="stadium"><option value="1">桐生</option><option value="2">戸田</option><option value="3">江戸川</option><option value="4">平和島</option><option value="5">多摩川</option><option value="6">浜名湖</option><option value="7">蒲郡</option><option value="8">常滑</option><option value="9">津</option><option value="10">三国</option><option value="11">びわこ</option><option value="12">住之江</option><option value="13">尼崎</option><option value="14">鳴門</option><option value="15">丸亀</option><option value="16">児島</option><option value="17">宮島</option><option value="18">徳山</option><option value="19">下関</option><option value="20">若松</option><option value="21" selected>芦屋</option><option value="22">福岡</option><option value="23">唐津</option><option value="24">大村</option></select></div><div class="grid" style="margin-top:8px"><select id="race"><option value="1">1R</option><option value="2">2R</option><option value="3">3R</option><option value="4">4R</option><option value="5">5R</option><option value="6">6R</option><option value="7">7R</option><option value="8">8R</option><option value="9">9R</option><option value="10">10R</option><option value="11">11R</option><option value="12">12R</option></select><button id="go">データ取得・予想</button></div><div id="status" class="small" style="margin-top:8px">場・レースを選択してください</div></div>
<div class="card"><b>① 6艇比較</b><div class="small">平均ST・全国/当地・モーター・展示・進入を横比較</div><div id="racers" class="small">未取得</div></div>
<div class="card"><b>② 当該コース実績（利用可能な全履歴）</b>
<div id="historyStatus" class="small">当日データ取得後に集計します</div>
<div id="courseHistory" class="small"></div></div>
<div class="card"><b>③ ST・1M展開</b><div id="stview" class="small">未取得</div></div>
<div class="card"><b>④ 展示補正</b><div id="exview" class="small">未取得</div></div>
<div class="card"><b>⑤ 最終結論</b><div id="info" class="small">未取得</div>
<div id="decision" class="pick"></div><div id="second" class="small"></div>
<div id="main" class="pick"></div><div id="fail" class="pick"></div>
<div id="cuts" class="small"></div></div></main>
<script>
const $=x=>document.getElementById(x),dt=$("date"),st=$("stadium"),rc=$("race");
let now=new Date();dt.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
function n(v,d=0){v=Number(v);return Number.isFinite(v)?v:d}
function score(r,l){let s=n(r.national_win_rate)*10+n(r.local_win_rate)*4+n(r.motor_top_2_percent)*.3+(.22-n(r.average_start_timing,.20))*90;if(l===1)s+=22;if(l===2)s+=8;if(l===3)s+=7;if(l===4)s+=4;return s}

function ymd2(x){return `${x.getFullYear()}${String(x.getMonth()+1).padStart(2,"0")}${String(x.getDate()).padStart(2,"0")}`}
async function loadMaxHistory(A){
 const hs=document.getElementById("historyStatus"), hv=document.getElementById("courseHistory");
 hs.textContent="2026/1/1〜前日までの利用可能な全結果を集計中…"; hv.innerHTML="";
 const target={};
 A.forEach(x=>target[String(x.r.number)]={lane:x.i,name:x.r.name||"",n:0,p1:0,p2:0,p3:0,stSum:0,stN:0,rankSum:0,rankN:0});
 let end=new Date(dt.value+"T12:00:00"), cur=new Date(2026,0,1), days=[];
 while(cur<end){days.push(new Date(cur));cur.setDate(cur.getDate()+1)}
 let pos=0, done=0;
 async function worker(){
   while(pos<days.length){
     const day=days[pos++], ds=ymd2(day);
     try{
       let r=await fetch(`https://boatraceopenapi.github.io/api/v1/${ds.slice(0,4)}/${ds}.json`,{cache:"force-cache"});
       if(!r.ok){done++;continue}
       let j=await r.json(), ss=j?.programs?.stadiums||{};
       for(const sk in ss) for(const rk in (ss[sk]?.races||{})){
         let rr=ss[sk].races[rk], rs=rr?.result?.racers;if(!rs)continue;
         let starts=[];
         for(let e=1;e<=6;e++){let z=rs[String(e)]||rs[e], q=Number(z?.start_timing);if(z&&Number.isFinite(q))starts.push({num:String(z.number),st:q})}
         starts.sort((a,b)=>a.st-b.st);
         for(let e=1;e<=6;e++){
           let z=rs[String(e)]||rs[e];if(!z)continue;
           let t=target[String(z.number)]; if(!t || Number(z.course_number)!==t.lane)continue;
           t.n++; let pl=Number(z.place_number); if(pl===1)t.p1++;if(pl===2)t.p2++;if(pl===3)t.p3++;
           let q=Number(z.start_timing);if(Number.isFinite(q)){t.stSum+=q;t.stN++;let ix=starts.findIndex(v=>v.num===String(z.number)&&v.st===q);if(ix>=0){t.rankSum+=ix+1;t.rankN++}}
         }
       }
     }catch(e){}
     done++; if(done%20===0)hs.textContent=`全履歴集計中… ${done}/${days.length}日`;
   }
 }
 await Promise.all(Array.from({length:10},worker));
 let T=Object.values(target).sort((a,b)=>a.lane-b.lane);
 hv.innerHTML=T.map(t=>{
   let pc=x=>t.n?(100*x/t.n).toFixed(1)+"%":"—", ast=t.stN?(t.stSum/t.stN).toFixed(3):"—", sr=t.rankN?(t.rankSum/t.rankN).toFixed(2):"—";
   return `<div class="row"><b>${t.lane}号艇 ${t.name}</b><br>${t.lane}コース　母数 <b>${t.n}走</b> / 1着 ${pc(t.p1)} / 2着 ${pc(t.p2)} / 3着 ${pc(t.p3)}<br>平均ST ${ast} / 平均ST順位 ${sr}</div>`;
 }).join("");
 hs.className="ok";hs.textContent=`全履歴集計完了：2026/01/01〜${dt.value}の前日（取得可能データ最大範囲）`;
 // Re-rank using course data with sample weighting and update picks
 const enriched=A.map(x=>{let t=target[String(x.r.number)],w=t?Math.min(1,t.n/30):0;
   let course=t&&t.n?((t.p1*3+t.p2*2+t.p3)/t.n)*20:0;
   return {...x,cs:x.sc*(1-.55*w)+course*.55*w,h:t};
 });
 let outer=enriched.slice(1).sort((a,b)=>b.cs-a.cs), aa=outer[0],bb=outer[1],cc=outer[2];
 let m=[`1-${aa.i}-${bb.i}`,`1-${bb.i}-${aa.i}`,`1-${aa.i}-${cc.i}`,`1-${bb.i}-${cc.i}`];
 let f=[`${aa.i}-1-${bb.i}`,`${aa.i}-${bb.i}-1`];
 document.getElementById("main").textContent="カテゴリーA（全履歴反映）　"+m.join(" / ");
 document.getElementById("fail").textContent="イン逃げ失敗時（全履歴反映）　"+f.join(" / ");
 document.getElementById("second").innerHTML=`2着候補順位（全履歴反映）：${outer.map(x=>x.i+"号艇").join(" ＞ ")}`;
}

async function run(){
 let status=$("status");status.className="small";status.textContent="取得中…";$("racers").innerHTML="";$("main").textContent="";$("fail").textContent="";
 try{
  let ds=dt.value.replaceAll("-",""), url=`https://boatraceopenapi.github.io/api/v1/${ds.slice(0,4)}/${ds}.json`;
  let res=await fetch(url,{cache:"no-store"});if(!res.ok)throw Error("API "+res.status);
  let data=await res.json(), rr=data?.programs?.stadiums?.[String(st.value)]?.races?.[String(rc.value)];
  if(!rr)throw Error("このレースのデータがありません");
  let A=[];
  for(let i=1;i<=6;i++){let r=rr.racers?.[String(i)]||{},p=rr.preview?.racers?.[String(i)]||{},sc=score(r,i);A.push({i,sc,r,p});
   $("racers").innerHTML+=`<div class="row"><b>${i}号艇 ${r.name||"—"}</b><br>平均ST ${r.average_start_timing??"—"} / 全国勝率 ${r.national_win_rate??"—"} / 当地 ${r.local_win_rate??"—"} / モーター2連 ${r.motor_top_2_percent??"—"}%<br>展示ST ${p.start_timing??"—"} / 展示 ${p.exhibition_time??"—"} / 進入 ${p.course_number??"—"}</div>`;
  }
  let o=A.slice(1).sort((a,b)=>b.sc-a.sc),a=o[0],b=o[1],c=o[2],avg=o.reduce((q,x)=>q+x.sc,0)/5,esc=Math.max(35,Math.min(82,Math.round(55+(A[0].sc-avg)*.45)));
  let mains=[`1-${a.i}-${b.i}`,`1-${b.i}-${a.i}`,`1-${a.i}-${c.i}`,`1-${b.i}-${c.i}`],fails=[`${a.i}-1-${b.i}`,`${a.i}-${b.i}-1`];
  let stOrder=[...A].sort((x,y)=>n(x.r.average_start_timing,.30)-n(y.r.average_start_timing,.30));
  let exA=A.map(x=>({i:x.i,st:n(x.p.start_timing,9),et:n(x.p.exhibition_time,99),course:n(x.p.course_number,x.i)}));
  let exValid=exA.filter(x=>x.st<1), etValid=exA.filter(x=>x.et<90);
  let exST=exValid.length?[...exValid].sort((x,y)=>x.st-y.st):[], exET=etValid.length?[...etValid].sort((x,y)=>x.et-y.et):[];
  let changed=exA.some(x=>x.course!==x.i);
  $("stview").innerHTML=`平均ST順：${stOrder.map(x=>x.i+"号艇("+((x.r.average_start_timing??"—"))+")").join(" → ")}<br>攻め候補：${a.i}号艇`;
  $("exview").innerHTML=exST.length?`展示ST順：${exST.map(x=>x.i+"号艇 "+x.st).join(" / ")}<br>展示T最速：${exET.length?exET[0].i+"号艇 "+exET[0].et:"未取得"}<br>${changed?"進入変化あり":"進入変化なし"}`:"直前情報は未公開。展示前評価を維持。";
  let ranked=o.map(x=>x.i+"号艇").join(" ＞ ");
  let cut=o.slice(-2).map(x=>x.i+"号艇").join("・");
  $("info").className="ok";$("info").innerHTML=`推定イン逃げ <b>${esc}%</b><br>データ取得：当日出走表 ${rr?"○":"×"} / 展示 ${exST.length?"○":"未公開"}`;
  $("decision").textContent=esc>=60?"購入検討：①逃げ中心":"見送り候補：逃げ信頼度60%未満";
  $("second").innerHTML=`2着候補順位：${ranked}`;
  $("main").textContent="カテゴリーA（本線）　"+mains.join(" / ");
  $("fail").textContent="イン逃げ失敗時　"+fails.join(" / ");
  $("cuts").innerHTML=`消し優先：${cut}<br><span class="small">※現版は取得済みデータだけで算出。未取得項目を推測で補完しません。</span>`;
  status.textContent="当日データ分析完了。全履歴を追加集計中…"; loadMaxHistory(A).then(()=>{status.textContent="全履歴反映まで完了"});
 }catch(e){status.className="err";status.textContent="取得失敗："+e.message}
}
$("go").addEventListener("click",run);
</script></body></html>
