<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>競艇予想 v0.4.0</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f5f8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#17212b}header{position:sticky;top:0;z-index:5;background:#fff;padding:12px;border-bottom:1px solid #ddd}h1{font-size:18px;margin:0}main{max-width:800px;margin:auto;padding:10px 10px 90px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:12px;margin:10px 0}h2{font-size:15px;margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea{width:100%;padding:9px;border:1px solid #ccd3dc;border-radius:8px;font:inherit;background:#fff}label{font-size:11px;color:#68727d;display:block;margin:7px 0 3px}button{border:0;border-radius:9px;padding:10px;font-weight:750}.primary{background:#1677ff;color:#fff}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tab.on{background:#1677ff;color:#fff}.panel{display:none}.panel.on{display:block}.status{font-size:12px;padding:8px;border-radius:8px;background:#eef3f8;margin-top:8px}.ok{background:#e6f7ec;color:#126c39}.err{background:#ffe8e8;color:#9d1b1b}.raceTitle{font-weight:800;font-size:16px}.racers{display:grid;gap:7px}.racer{border:1px solid #e0e5eb;border-radius:10px;padding:8px;display:grid;grid-template-columns:34px 1fr;gap:8px}.lane{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;border:1px solid #aaa}.l1{background:#fff}.l2{background:#222;color:#fff}.l3{background:#e43d3d;color:#fff}.l4{background:#315ee8;color:#fff}.l5{background:#ffe238}.l6{background:#168f49;color:#fff}.name{font-weight:800}.meta{font-size:11px;color:#64707b;line-height:1.55}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}.metric{background:#f6f8fa;border-radius:6px;padding:5px;font-size:10px}.metric b{display:block;font-size:12px}.coursebox{margin-top:7px;padding:7px;background:#eef5ff;border-radius:8px}.coursehead{font-size:11px;font-weight:800;margin-bottom:5px}.coursegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.coursemetric{background:#fff;border-radius:6px;padding:5px;font-size:9px}.coursemetric b{display:block;font-size:11px}.coursefoot{font-size:9px;color:#64707b;margin-top:5px}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pv{background:#f7f8fa;border-radius:8px;padding:7px;font-size:11px}.note{font-size:11px;color:#69737d}.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#eef3f8;font-size:11px;margin:2px}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}footer button{flex:1}</style></head><body>
<header><h1>競艇予想システム <span style="color:#1677ff">v0.4.0</span></h1><div class="note">出走表・コース実績・展示を取得 → 筋・逃げ率・買い目まで自動分析</div></header><main>
<section class="card"><h2>レース選択</h2><div class="grid"><div><label>日付</label><input id="date" type="date"></div><div><label>場</label><select id="stadium"><option value="1">桐生</option><option value="2">戸田</option><option value="3">江戸川</option><option value="4">平和島</option><option value="5">多摩川</option><option value="6">浜名湖</option><option value="7">蒲郡</option><option value="8">常滑</option><option value="9">津</option><option value="10">三国</option><option value="11">びわこ</option><option value="12">住之江</option><option value="13">尼崎</option><option value="14">鳴門</option><option value="15">丸亀</option><option value="16">児島</option><option value="17">宮島</option><option value="18">徳山</option><option value="19">下関</option><option value="20">若松</option><option value="21" selected>芦屋</option><option value="22">福岡</option><option value="23">唐津</option><option value="24">大村</option></select></div></div><div class="grid"><div><label>レース</label><select id="race"><option value="1">1R</option><option value="2">2R</option><option value="3">3R</option><option value="4">4R</option><option value="5">5R</option><option value="6">6R</option><option value="7" selected>7R</option><option value="8">8R</option><option value="9">9R</option><option value="10">10R</option><option value="11">11R</option><option value="12">12R</option></select></div><div style="align-self:end"><button id="fetchBtn" class="primary" style="width:100%">データ取得</button></div></div><div id="status" class="status">日付・場・Rを選んで「データ取得」</div></section>
<div class="tabs"><button class="tab on" data-id="p1">①自動取得</button><button class="tab" data-id="p2">②筋</button><button class="tab" data-id="p3">③展示</button><button class="tab" data-id="p4">④結論</button></div>
<section id="p1" class="panel on"><div class="card"><div id="raceInfo"><span class="note">まだ取得していません</span></div></div><div class="card"><h2>6艇比較</h2><div id="racers" class="racers"></div></div><div class="card"><h2>直前情報</h2><div id="preview" class="preview"><span class="note">公開後に再取得すると表示します</span></div></div></section>
<section id="p2" class="panel card">
<h2>筋・連動分析</h2>
<div id="flowAuto" class="status">データ取得後に自動分析します。</div>
<label>補足メモ</label><textarea id="flow1" rows="3"></textarea>
</section>

<section id="p3" class="panel card">
<h2>展示補正</h2>
<p class="note">展示STは単発。長期/今節STを上書きせず、進入変化・複数指標一致・明確な異常値のみ強く補正。</p>
<div id="exAuto" class="status">直前情報公開後に自動分析します。</div>
<label>展示メモ</label><textarea id="exMemo" rows="4"></textarea>
<label>展示前 逃げ成立率</label><input id="preEscape" readonly>
<label>展示後 逃げ成立率</label><input id="postEscape" readonly>
</section>

<section id="p4" class="panel card">
<h2>最終結論</h2>
<div id="finalAuto" class="status">データ取得後に自動生成します。</div>
<label>カテゴリーA（本線）</label><input id="mainPick" readonly>
<label>イン逃げ失敗時</label><input id="failPick" readonly>
<label>消し艇＋根拠</label><textarea id="cuts" rows="3" readonly></textarea>
<label>結果</label><input id="result">
<label>検証</label><textarea id="review" rows="4"></textarea>
<p><span class="badge">大母数優先</span><span class="badge">展示は補正</span><span class="badge">予想サイト不使用</span></p>
</section>
</main><footer><button id="saveBtn">保存</button><button id="fetchAgain" class="primary">最新データ再取得</button></footer>
<script>
const ST={1:"桐生",2:"戸田",3:"江戸川",4:"平和島",5:"多摩川",6:"浜名湖",7:"蒲郡",8:"常滑",9:"津",10:"三国",11:"びわこ",12:"住之江",13:"尼崎",14:"鳴門",15:"丸亀",16:"児島",17:"宮島",18:"徳山",19:"下関",20:"若松",21:"芦屋",22:"福岡",23:"唐津",24:"大村"};
stadium.value="21";race.value="7";
let now=new Date();date.value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,"0"),String(now.getDate()).padStart(2,"0")].join("-");
const rank=n=>({1:"A1",2:"A2",3:"B1",4:"B2"}[n]||("級"+(n??"-"))); const val=(x,s="")=>x==null?"未取得":x+s;
function apiURL(){let d=date.value.replaceAll("-","");return `https://boatraceopenapi.github.io/api/v1/${d.slice(0,4)}/${d}.json`}
async function getData(){status.className="status";status.textContent="取得中…";try{let res=await fetch(apiURL(),{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);let data=await res.json();let rr=data?.programs?.stadiums?.[stadium.value]?.races?.[race.value];if(!rr)throw Error("指定レースが見つかりません");render(rr);status.className="status";status.textContent="出走表取得完了。続けて当該コース実績を集計しています…";await loadCourseStats(rr);status.className="status ok";status.textContent="取得完了。当該コース1/2/3着率・母数・コース平均ST・平均ST順位まで反映しました。直前情報が未公開なら展示後に再取得してください。";localStorage.setItem("brp_v03_last",JSON.stringify({date:date.value,stadium:stadium.value,race:race.value}));}catch(e){status.className="status err";status.innerHTML="自動取得できませんでした： "+e.message+"<br><span class='note'>非公式APIのため遅延・欠損の可能性があります。公式確認を前提に使います。</span>"}}
function render(rr){raceInfo.innerHTML=`<div class="raceTitle">${ST[rr.stadium_number]} ${rr.race_number}R　${rr.subtitle||""}</div><div class="meta">${rr.date} / 締切 ${rr.closed_at||"未取得"} / ${rr.day_number?rr.day_number+"日目":""} / ${rr.distance||1800}m<br>${rr.title||""}</div>`;
racers.innerHTML="";for(let i=1;i<=6;i++){let r=rr.racers?.[i]||{};let el=document.createElement("div");el.className="racer";el.innerHTML=`<div class="lane l${i}">${i}</div><div><div class="name">${r.name||"未取得"} <span class="note">${rank(r.rank_number)} / ${r.number||"-"}</span></div><div class="meta">平均ST ${val(r.average_start_timing)}　F${val(r.flying_count)} L${val(r.late_count)}　モーター ${val(r.motor_number)}号</div><div class="metrics"><div class="metric">全国勝率<b>${val(r.national_win_rate)}</b></div><div class="metric">当地勝率<b>${val(r.local_win_rate)}</b></div><div class="metric">モーター2連<b>${val(r.motor_top_2_percent,"%")}</b></div></div><div class="coursebox" id="course-${i}"><div class="coursehead">${i}コース実績（直近180日）</div><div class="coursegrid"><div class="coursemetric">1着率<b>集計中</b></div><div class="coursemetric">2着率<b>集計中</b></div><div class="coursemetric">3着率<b>集計中</b></div></div><div class="coursefoot">母数・コース平均ST・平均ST順位を集計中</div></div></div>`;racers.appendChild(el)}
let p=rr.preview; if(p&&p.racers){preview.innerHTML="";for(let i=1;i<=6;i++){let r=p.racers?.[i]||{};let x=document.createElement("div");x.className="pv";x.innerHTML=`<b>${i}号艇</b><br>進入 ${val(r.course_number)}C<br>展示ST ${val(r.start_timing)}<br>展示 ${val(r.exhibition_time)}<br>チルト ${val(r.tilt_adjustment)}`;preview.appendChild(x)}let w=document.createElement("div");w.className="pv";w.innerHTML=`<b>気象</b><br>風 ${val(p.wind_speed,"m")}<br>波 ${val(p.wave_height,"cm")}<br>気温 ${val(p.air_temperature,"℃")}`;preview.appendChild(w)}else preview.innerHTML='<span class="note">直前情報はまだ未取得です。</span>'}

function pct(n,d){return d?((n/d)*100).toFixed(1)+"%":"—"}
function ymd(dt){return [dt.getFullYear(),String(dt.getMonth()+1).padStart(2,"0"),String(dt.getDate()).padStart(2,"0")].join("")}
function resultURL(dt){let d=ymd(dt);return `https://boatraceopenapi.github.io/api/v1/${d.slice(0,4)}/${d}.json`}
async function loadCourseStats(rr){
  const targets={}; for(let i=1;i<=6;i++){let r=rr.racers?.[i]||{};targets[String(r.number)]={lane:i,course:i,n:0,p1:0,p2:0,p3:0,stSum:0,stN:0,rankSum:0,rankN:0}}
  let end=new Date(date.value+"T12:00:00"), start=new Date(end);start.setDate(start.getDate()-180);let floor=new Date("2026-01-01T12:00:00");if(start<floor)start=floor;
  let days=[];for(let d=new Date(start);d<end;d.setDate(d.getDate()+1))days.push(new Date(d));
  let done=0;
  async function oneDay(dt){try{let res=await fetch(resultURL(dt),{cache:"force-cache"});if(!res.ok)return;let data=await res.json();let stadiums=data?.programs?.stadiums||{};for(let sk in stadiums){let races=stadiums[sk]?.races||{};for(let rk in races){let raceObj=races[rk];let result=raceObj?.result;if(!result?.racers)continue;let all=[];for(let e=1;e<=6;e++){let x=result.racers?.[e];if(x&&x.start_timing!=null&&!Number.isNaN(Number(x.start_timing)))all.push({num:String(x.number),st:Number(x.start_timing)})}let sorted=[...all].sort((a,b)=>a.st-b.st);for(let e=1;e<=6;e++){let x=result.racers?.[e];if(!x)continue;let t=targets[String(x.number)];if(!t||Number(x.course_number)!==t.course)continue;t.n++;let pl=Number(x.place_number);if(pl===1)t.p1++;if(pl===2)t.p2++;if(pl===3)t.p3++;let st=Number(x.start_timing);if(Number.isFinite(st)){t.stSum+=st;t.stN++;let idx=sorted.findIndex(z=>z.num===String(x.number)&&z.st===st);if(idx>=0){t.rankSum+=idx+1;t.rankN++}}}}}}catch(e){}finally{done++;if(done%10===0||done===days.length)status.textContent=`当該コース実績を集計中… ${done}/${days.length}日`}}
  const concurrency=8;let pos=0;async function worker(){while(pos<days.length){let d=days[pos++];await oneDay(d)}}await Promise.all(Array.from({length:Math.min(concurrency,days.length)},worker));
  for(let k in targets){let t=targets[k],box=document.getElementById(`course-${t.lane}`);if(!box)continue;let avst=t.stN?(t.stSum/t.stN).toFixed(3):"—",avrank=t.rankN?(t.rankSum/t.rankN).toFixed(2):"—";box.innerHTML=`<div class="coursehead">${t.course}コース実績（直近180日）</div><div class="coursegrid"><div class="coursemetric">1着率<b>${pct(t.p1,t.n)}</b></div><div class="coursemetric">2着率<b>${pct(t.p2,t.n)}</b></div><div class="coursemetric">3着率<b>${pct(t.p3,t.n)}</b></div></div><div class="coursefoot">母数 ${t.n}走 ／ コース平均ST ${avst} ／ 平均ST順位 ${avrank}</div>`}
  analyzeAll(rr,targets);
}


let ANALYSIS={targets:null,rr:null};

function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function num(x,d=0){x=Number(x);return Number.isFinite(x)?x:d}
function fmtRate(x){return Number.isFinite(x)?x.toFixed(1)+"%":"—"}

function analyzeAll(rr,targets){
  ANALYSIS={rr,targets};
  const T=Object.values(targets).sort((a,b)=>a.lane-b.lane);
  if(T.length!==6)return;

  // Base score: course finish rates + course ST + national/local ability.
  T.forEach(t=>{
    const r=rr.racers?.[t.lane]||{};
    t.r1=t.n?100*t.p1/t.n:0; t.r2=t.n?100*t.p2/t.n:0; t.r3=t.n?100*t.p3/t.n:0;
    t.avst=t.stN?t.stSum/t.stN:num(r.average_start_timing,.20);
    t.score=1.7*t.r1+1.05*t.r2+.55*t.r3 + 18*(.22-t.avst)
      + 2.2*num(r.national_win_rate,5)+1.1*num(r.local_win_rate,5);
  });

  const one=T[0], two=T[1], three=T[2], four=T[3];
  const wall=(two.avst+three.avst)/2;
  let escape=58 + (wall-one.avst)*115 + (one.r1-50)*.28;
  escape += (one.score-Math.max(two.score,three.score,four.score))*.025;
  escape=clamp(escape,35,82);

  const attack=T.slice(1).sort((a,b)=>b.score-a.score);
  const attacker=attack[0];
  const followers=T.slice(1).filter(x=>x.lane!==attacker.lane).sort((a,b)=>b.score-a.score);

  preEscape.value=Math.round(escape)+"%";

  let lines=[];
  lines.push(`ST起点：① ${one.avst.toFixed(3)} / ② ${two.avst.toFixed(3)} / ③ ${three.avst.toFixed(3)} / ④ ${four.avst.toFixed(3)}`);
  lines.push(`①逃げ推定：${Math.round(escape)}%。②③の壁と当該コース実績を優先。`);
  lines.push(`攻め艇候補：${attacker.lane}号艇。攻め切りだけでなく「①は逃げるが${attacker.lane}が2着残り」も同時評価。`);
  lines.push(`相手序列：${attack.map(x=>x.lane+"号艇").join(" → ")}`);
  flowAuto.className="status ok"; flowAuto.innerHTML=lines.join("<br>");

  // Main combinations: 1st=1, rank second/third by scores with attacker retained.
  const sec=attack.slice(0,3);
  let mains=[];
  for(const s of sec){
    const thirds=T.slice(1).filter(x=>x.lane!==s.lane).sort((a,b)=>b.score-a.score).slice(0,2);
    thirds.forEach(th=>mains.push({pick:`1-${s.lane}-${th.lane}`,v:s.score+th.score*.55+(s.lane===attacker.lane?8:0)}));
  }
  mains.sort((a,b)=>b.v-a.v);
  const uniq=[...new Map(mains.map(x=>[x.pick,x])).values()].slice(0,4).map(x=>x.pick);

  // Failure: attacker / 2 / 3 heads, 1 retained in 2nd where natural.
  let fails=[];
  [attacker,...attack.filter(x=>x.lane!==attacker.lane).slice(0,2)].forEach(h=>{
    const th=T.slice(1).filter(x=>x.lane!==h.lane).sort((a,b)=>b.score-a.score)[0];
    if(th) fails.push(`${h.lane}-1-${th.lane}`);
  });

  mainPick.value=uniq.join(" / ");
  failPick.value=[...new Set(fails)].slice(0,3).join(" / ");

  const cut2=T.slice(1).sort((a,b)=>a.score-b.score).slice(0,2);
  cuts.value=cut2.map(x=>`${x.lane}号艇：当該コース実績・ST・能力の総合点が下位`).join("\n");

  applyPreview(rr,escape,attacker,T);
}

function applyPreview(rr,escape,attacker,T){
  const p=rr.preview;
  if(!p?.racers){
    exAuto.className="status";
    exAuto.textContent="直前情報は未公開。展示前評価を維持します。";
    postEscape.value="未公開";
    finalAuto.className="status ok";
    finalAuto.innerHTML=`展示前：逃げ ${Math.round(escape)}%。本線 ${mainPick.value}`;
    return;
  }
  let ex=[];
  for(let i=1;i<=6;i++){
    const r=p.racers?.[i]||{};
    ex.push({lane:i,st:num(r.start_timing,.30),time:num(r.exhibition_time,99),course:num(r.course_number,i)});
  }
  const bestST=[...ex].sort((a,b)=>a.st-b.st)[0];
  const bestEx=[...ex].sort((a,b)=>a.time-b.time)[0];
  const e1=ex[0];
  let post=escape;
  const avgOuter=ex.slice(1,4).reduce((s,x)=>s+x.st,0)/3;
  post += (avgOuter-e1.st)*35;
  if(bestST.lane!==1 && bestST.st+0.05<e1.st) post-=4;
  if(bestEx.lane===1) post+=2;
  if(bestEx.lane===attacker.lane) post-=2;
  const changed=ex.some(x=>x.course!==x.lane);
  if(changed) post-=6;
  post=clamp(post,30,85);
  postEscape.value=Math.round(post)+"%";

  exAuto.className="status ok";
  exAuto.innerHTML=`展示ST最速：${bestST.lane}号艇 ${bestST.st.toFixed(2)} ／ 展示T最速：${bestEx.lane}号艇 ${bestEx.time.toFixed(2)}`
    +(changed?"<br>進入変化あり：評価を強めに再補正":"<br>進入変化なし：長期データの序列を基本維持");

  let verdict=post>=60?"①逃げを本線":"①逃げは見送り水準";
  finalAuto.className="status ok";
  finalAuto.innerHTML=`展示後逃げ推定 ${Math.round(post)}%：${verdict}<br>本線 ${mainPick.value}<br>逃げ失敗 ${failPick.value}`;
}

fetchBtn.onclick=getData;fetchAgain.onclick=getData;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.id).classList.add("on")});
const ids=["flow1","flow3","flow4","z","motorMemo","exMemo","preEscape","postEscape","mainPick","failPick","cuts","result","review"];saveBtn.onclick=()=>{let d={};ids.forEach(i=>d[i]=document.getElementById(i).value);localStorage.setItem("brp_v02_notes",JSON.stringify(d));saveBtn.textContent="保存 ✓";setTimeout(()=>saveBtn.textContent="保存",900)};let n=JSON.parse(localStorage.getItem("brp_v02_notes")||"{}");ids.forEach(i=>document.getElementById(i).value=n[i]||"");
</script></body></html>
